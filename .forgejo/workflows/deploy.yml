name: Test and deploy OpenFotoFrame

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv venv && uv pip install -r requirements.txt
      - run: uv run --no-project python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy the tested commit on Swagner Server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.OPENFOTOFRAME_DEPLOY_SSH_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -n "$DEPLOY_SSH_KEY"
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' '172.20.0.1 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC3bi8/RRmvk1pIu5THRgKrUpStbqPEWoRMlj/bRCWIE' > "$known_hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" \
            awagner@172.20.0.1 "deploy $DEPLOY_SHA"
