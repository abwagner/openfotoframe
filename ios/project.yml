name: OpenFotoFrame
options:
  bundleIdPrefix: tech.swagner
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    FRAME_PASSKEY_DOMAIN: ""
    FRAME_HOSTED_SERVER_URL: ""
    FRAME_INVITE_URL: ""
targets:
  OpenFotoFrame:
    type: application
    platform: iOS
    sources:
      - path: OpenFotoFrame
      - path: ../static/mat-colors.json
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.swagner.openfotoframe
        DEVELOPMENT_TEAM: "$(OPENFOTOFRAME_DEVELOPMENT_TEAM)"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: OpenFotoFrame/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OpenFotoFrameTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OpenFotoFrameTests]
    dependencies:
      - target: OpenFotoFrame
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  OpenFotoFrameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OpenFotoFrameUITests]
    dependencies:
      - target: OpenFotoFrame
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  OpenFotoFrameTailscale:
    build:
      targets:
        OpenFotoFrame: all
    test:
      targets: [OpenFotoFrameUITests]
      environmentVariables:
        FRAME_TEST_TAILSCALE: "1"
  OpenFotoFrame:
    build:
      targets:
        OpenFotoFrame: all
    test:
      targets: [OpenFotoFrameTests, OpenFotoFrameUITests]
  OpenFotoFrameIntegration:
    build:
      targets:
        OpenFotoFrame: all
    test:
      targets: [OpenFotoFrameTests, OpenFotoFrameUITests]
      environmentVariables:
        FRAME_TEST_SERVER: http://127.0.0.1:5059
        FRAME_TEST_USERNAME: admin
        FRAME_TEST_PASSWORD: ios-integration-password

  OpenFotoFrameReleaseIntegration:
    build:
      targets:
        OpenFotoFrame: all
    test:
      targets: [OpenFotoFrameTests, OpenFotoFrameUITests]
      environmentVariables:
        FRAME_TEST_RELEASE_SERVER: http://127.0.0.1:5081
