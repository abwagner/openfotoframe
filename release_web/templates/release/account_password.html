{% extends 'release/base.html' %}{% block content %}<h1>Change password</h1><p>This signs out every device, including this browser. Sign in again with your new password.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Authenticator or recovery code, if needed<input name="code" autocomplete="one-time-code"></label><button>Change password and sign out devices</button></form><a href="/account">Back to account</a>{% endblock %}
